services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: courtiq
      POSTGRES_USER: courtiq
      POSTGRES_PASSWORD: courtiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      COURTIQ_ENV: docker
      COURTIQ_ALLOW_DEMO: "false"
      COURTIQ_CORS_ORIGINS: http://localhost:5173,http://localhost:8000
      COURTIQ_RATE_LIMIT_PER_MINUTE: "120"
      COURTIQ_UPLOAD_LIMIT_BYTES: "83886080"
      DATABASE_URL: postgresql+psycopg://courtiq:courtiq@postgres:5432/courtiq
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
