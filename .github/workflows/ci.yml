name: CourtIQ CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Python lint
        run: python -m ruff check backend ml scripts tests
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript syntax checks
        run: |
          node --check outputs/tennis-ai-app/app.js
          for file in outputs/tennis-ai-app/js/*.js; do node --check "$file"; done
          node --check work/backtest_courtiq_model.js
