[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "output", "outputs", "work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/routes.py" = ["B008"] # FastAPI dependency declarations use callable defaults.
"scripts/*.py" = ["E402"] # Executable scripts bootstrap the repository root before local imports.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
